version: "3.8"

networks:
  xray-net:
    driver: bridge

volumes:
  mongo-data:
  backend-uploads:

services:
  # ─── MongoDB Database ───────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-nihxray}
    volumes:
      - mongo-data:/data/db
    networks:
      - xray-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Python AI Microservice (FastAPI + PyTorch) ─────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/test_nih/saved_models/nih_densenet121.pth
      CONFIG_DIR: /app/configs
      LOG_LEVEL: info
    volumes:
      # Mount host model directory (contains nih_densenet121.pth)
      - ${MODEL_HOST_PATH:-./ai-service/test_nih/saved_models}:/app/test_nih/saved_models
      # Persist retrained checkpoints and exported ONNX models
      - ./ai-service/outputs:/app/outputs
    networks:
      - xray-net
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Node.js / Express Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-secret}@mongo:27017/${MONGO_DB:-nihxray}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey123}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AI_SERVICE_URL: http://ai-service:8000
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - xray-net
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  # ─── React Frontend (Nginx Reverse Proxy) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api
        REACT_APP_AI_API_URL: /ai-api
    container_name: frontend
    restart: unless-stopped
    networks:
      - xray-net
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
      ai-service:
        condition: service_healthy
