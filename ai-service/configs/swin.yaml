# SwinCheX Transformer Classifier configuration (inherits base.yaml)
# Reference: https://github.com/rajaatreja/SwinCheX_Classifier
base_config: "base.yaml"

model:
  name: "swin"
  architecture: "swin_large_patch4_window7_224"
  pretrained: true
  num_classes: 15

training:
  batch_size: 16
  learning_rate: 0.0001
  weight_decay: 0.0001

output:
  save_dir: "outputs/retrained/swin"

