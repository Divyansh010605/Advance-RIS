# DenseNet-121 configuration (inherits base.yaml)
base_config: "base.yaml"

model:
  name: "densenet121"
  architecture: "densenet121"
  pretrained: true
  num_classes: 15

training:
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001

output:
  save_dir: "outputs/retrained/densenet121"
